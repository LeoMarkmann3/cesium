<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>MT Viewer — multi-temporal point cloud test</title>
    <link rel="stylesheet" href="MTViewer.css" media="screen" />
  </head>
  <body style="background: #000">
    <div id="cesiumContainer" class="fullWindow"></div>
    <div id="loadingIndicator" class="loadingIndicator"></div>
    <div id="mtPanel" class="mtPanel" style="display: none">
      <div class="mtTitle">Multi-temporal</div>
      <div id="mtKeys" class="mtRow"></div>
      <div id="mtActive" class="mtRow"></div>
      <div id="mtPicked" class="mtRow">Picked instance_id: —</div>
      <div class="mtHelp">
        Switch: number keys (1–9) or ← →. &nbsp; Pick a tree: left-click. Clear
        highlight: right-click.
      </div>
    </div>
    <script src="MTViewer.js" type="module"></script>
  </body>
</html>
